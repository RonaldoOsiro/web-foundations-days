<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Capture your thoughts, categorize, and organize effortlessly.</p>
    </header>

    <main>
        <section id="add-section">
            <h2>Add a note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note Text:</label>
                    <input type="text" id="note-input" placeholder="Type your note here...">
                </div>

                <div class="form-group row">
                    <div class="field">
                        <label for="note-category">Category:</label>
                        <select id="note-category">
                            <option value="Personal">Personal</option>
                            <option value="Work">Work</option>
                            <option value="Study">Study</option>
                        </select>
                    </div>
                    <button type="submit">Add Note</button>
                </div>

                <p id="error-message"></p>
            </form>
        </section>

        <section id="notes-section">
            <div class="notes-header-row">
                <h2>Your notes</h2>
                <div class="controls-group">
                    <input type="text" id="search-input" placeholder="Search notes...">
                    <button id="clear-all-btn" class="clear-all">Clear All</button>
                </div>
            </div>

            <p id="note-count">You have no notes yet.</p>
            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes App. Built for Web Foundations.</p>
    </footer>
</body>
</html>
